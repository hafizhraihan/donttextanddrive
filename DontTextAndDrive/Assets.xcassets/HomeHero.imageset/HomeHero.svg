<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="200" y1="0" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="chatGrad" x1="0" y1="0" x2="160" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="220" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Perspective Road -->
  <polygon points="140,0 260,0 320,220 80,220" fill="url(#roadGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Yellow Dashed Road Centerlines -->
  <line x1="200" y1="10" x2="200" y2="45" stroke="#FACC15" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="65" x2="200" y2="110" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="135" x2="200" y2="195" stroke="#FACC15" stroke-width="6" stroke-linecap="round"/>

  <!-- Speed Lines -->
  <line x1="60" y1="160" x2="110" y2="180" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="340" y1="160" x2="290" y2="180" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Compact Car -->
  <g transform="translate(176, 120)">
    <!-- Car Drop Shadow -->
    <rect x="-2" y="6" width="52" height="84" rx="14" fill="#000000" opacity="0.5"/>
    <!-- Car Body Chassis -->
    <rect x="0" y="0" width="48" height="80" rx="12" fill="url(#carGrad)" stroke="#7DD3FC" stroke-width="2"/>
    <!-- Windshield -->
    <rect x="6" y="16" width="36" height="18" rx="5" fill="#0F172A"/>
    <!-- Roof -->
    <rect x="7" y="38" width="34" height="20" rx="4" fill="#0284C7"/>
    <!-- Rear Window -->
    <rect x="8" y="61" width="32" height="10" rx="3" fill="#0F172A"/>
    <!-- Headlights -->
    <circle cx="8" cy="4" r="3" fill="#FEF08A"/>
    <circle cx="40" cy="4" r="3" fill="#FEF08A"/>
    <!-- Taillights -->
    <circle cx="8" cy="76" r="3.5" fill="#EF4444"/>
    <circle cx="40" cy="76" r="3.5" fill="#EF4444"/>
  </g>

  <!-- Incoming Floating Chat Bubble (Top-Right) -->
  <g transform="translate(205, 20)">
    <rect width="170" height="56" rx="16" fill="url(#chatGrad)" stroke="#C084FC" stroke-width="1.5"/>
    <!-- Avatar Circle -->
    <circle cx="22" cy="28" r="12" fill="#FFFFFF" opacity="0.2"/>
    <!-- Chat Icon Vector inside Avatar -->
    <path d="M16 23C16 21.3431 17.3431 20 19 20H25C26.6569 20 28 21.3431 28 23V27C28 28.6569 26.6569 30 25 30H20L17 33V30H19C17.3431 30 16 28.6569 16 27V23Z" fill="#FFFFFF"/>
    <!-- Text in Bubble -->
    <text x="42" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">MOM (URGENT)</text>
    <text x="42" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="normal" fill="#E0E7FF">Where are you?!</text>
    <!-- Notification badge on bubble -->
    <circle cx="160" cy="14" r="6" fill="#EF4444"/>
    <text x="160" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>

  <!-- Floating Traffic Light Mini Indicator (Top-Left) -->
  <g transform="translate(35, 25)">
    <rect width="28" height="68" rx="8" fill="#1E293B" stroke="#FACC15" stroke-width="1.5"/>
    <circle cx="14" cy="16" r="6" fill="#EF4444"/>
    <circle cx="14" cy="34" r="6" fill="#713F12" opacity="0.6"/>
    <circle cx="14" cy="52" r="6" fill="#064E3B" opacity="0.6"/>
  </g>
</svg>
